[package]
name = "tether-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
flatbuffers = { version = "25.12.19", default-features = false }
cobs = { version = "0.5.1", default-features = false, features = ["alloc"] }
crc32fast = { version = "1.5.2", default-features = false }
tether = { version = "0.1.0", path = "../tether" }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
