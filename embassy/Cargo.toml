[package]
name = "tether-embassy"
version = "0.1.0"
edition = "2024"
publish = false
description = "tether's I/O tasks over embedded-io-async and embassy-time"

[dependencies]
tether = { version = "0.1.0", path = "../tether" }
tether-core = { version = "0.1.0", path = "../core" }
embassy-futures = "0.1"
embassy-time = "0.5"
embedded-io-async = "0.7"

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor", "std"] }
# The host tests run on a clock they advance themselves.
embassy-time = { version = "0.5", features = ["mock-driver", "generic-queue-64"] }
critical-section = { version = "1", features = ["std"] }
